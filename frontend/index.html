<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERIS | Personal AI OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ERIS <span>v1</span></h2>
                <button id="new-session-btn" class="primary-btn">+ New Chat</button>
            </div>
            <div class="session-list" id="session-list">
                </div>
        </aside>

        <main class="chat-container">
            <div class="chat-header">
                <h3 id="current-session-title">Select or create a session</h3>
            </div>
            
            <div class="chat-history" id="chat-history">
                <div class="system-message">
                    Welcome to ERIS. System foundation initialized.
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chat-form">
                    <textarea 
                        id="user-input" 
                        placeholder="Message ERIS..." 
                        rows="1" 
                        required
                        disabled
                    ></textarea>
                    <button type="submit" id="send-btn" disabled>Send</button>
                </form>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
